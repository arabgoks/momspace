<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MomSpace · Tambah Lokasi Baru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #F6EFEA;
    font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
    color: #333727;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="nav-icons.jsx"></script>
<script type="text/babel" src="navbars.jsx"></script>
<script type="text/babel" src="home-map.jsx"></script>
<script type="text/babel" src="submit-screen.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

const DEFAULTS = /*EDITMODE-BEGIN*/{
  "focusVariant": "filled"
}/*EDITMODE-END*/;

function Phone({ variant }) {
  return (
    <IOSDevice width={380} height={820}>
      <SubmitScreen variant={variant} />
    </IOSDevice>
  );
}

// ─────────────────────────────────────────────────────────────
// Brand header
// ─────────────────────────────────────────────────────────────
function BrandHeader() {
  return (
    <div style={{ width: 760, padding: '0 0 8px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
        <div style={{
          width: 44, height: 44, borderRadius: 14,
          background: 'linear-gradient(140deg, #E8A598, #F2C6B8)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: '#fff', fontWeight: 900, fontSize: 20, fontFamily: 'Nunito',
          boxShadow: '0 8px 18px rgba(232,165,152,0.4)',
        }}>M</div>
        <div>
          <div style={{ fontSize: 28, fontWeight: 900, letterSpacing: -0.5, fontFamily: 'Nunito' }}>
            MomSpace · Tambah Lokasi Baru
          </div>
          <div className="mono" style={{ fontSize: 12, color: '#8A7268', marginTop: 2 }}>
            User submission with admin verification queue · iPhone + Web
          </div>
        </div>
      </div>
      <div style={{
        fontSize: 14.5, color: '#5C5347', lineHeight: 1.55,
        maxWidth: 720, fontWeight: 500,
      }}>
        Users propose lactation rooms not yet listed; submissions enter a
        pending queue that the Dinas Kesehatan admin reviews on the gov
        dashboard before going live.
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Components sheet — info banner, category card, time picker
// ─────────────────────────────────────────────────────────────
function ComponentSheet() {
  return (
    <div style={{
      width: 760, padding: 32, background: '#FFFDFB',
      borderRadius: 24, border: '1px solid rgba(60,40,30,0.06)',
    }}>
      <div className="mono" style={{
        fontSize: 11, color: '#A89991', textTransform: 'uppercase',
        letterSpacing: 1.4, marginBottom: 6,
      }}>03 · COMPONENTS</div>
      <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 22, fontFamily: 'Nunito' }}>
        Building blocks
      </div>

      {/* Status pill states */}
      <div className="mono" style={{
        fontSize: 11, color: '#A89991', textTransform: 'uppercase',
        letterSpacing: 1.4, marginBottom: 10,
      }}>Verification status pill</div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 22 }}>
        <StatusPill kind="pending" />
        <StatusPill kind="approved" />
        <StatusPill kind="rejected" />
      </div>

      {/* Category card */}
      <div className="mono" style={{
        fontSize: 11, color: '#A89991', textTransform: 'uppercase',
        letterSpacing: 1.4, marginBottom: 10,
      }}>Category select · selected vs idle</div>
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 22,
      }}>
        <CatExample kind="mall"     label="Pusat Perbelanjaan" selected />
        <CatExample kind="hospital" label="Rumah Sakit / Klinik" />
        <CatExample kind="park"     label="Taman Kota" />
      </div>

      {/* Tokens */}
      <div className="mono" style={{
        fontSize: 11, color: '#A89991', textTransform: 'uppercase',
        letterSpacing: 1.4, marginBottom: 10,
      }}>Tokens added</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
        {[
          ['#D9982A', 'Amber · Pending'],
          ['rgba(217,152,42,0.14)', 'Amber tint'],
          ['#E8A598', 'Primary · Rose'],
          ['#8FAF8F', 'Sage · Approved'],
          ['#C97A6E', 'Critical · Rejected'],
        ].map(([hex, n]) => (
          <div key={n} style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '8px 12px 8px 8px', background: '#F7EFE8', borderRadius: 99,
          }}>
            <div style={{
              width: 22, height: 22, borderRadius: 99, background: hex,
              border: '1px solid rgba(60,40,30,0.08)',
            }} />
            <div style={{ fontWeight: 700, fontSize: 12, fontFamily: 'Nunito' }}>{n}</div>
            <div className="mono" style={{ fontSize: 10.5, color: '#A89991' }}>{hex}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function StatusPill({ kind }) {
  const map = {
    pending:  { bg: 'rgba(217,152,42,0.14)', bd: 'rgba(217,152,42,0.32)', fg: '#D9982A',
                label: 'Pending verifikasi', dot: '#D9982A' },
    approved: { bg: 'rgba(143,175,143,0.18)', bd: 'rgba(143,175,143,0.36)', fg: '#6B8A6B',
                label: 'Disetujui & tayang',   dot: '#8FAF8F' },
    rejected: { bg: 'rgba(201,122,110,0.12)', bd: 'rgba(201,122,110,0.32)', fg: '#C97A6E',
                label: 'Ditolak',              dot: '#C97A6E' },
  }[kind];
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: 7,
      padding: '6px 12px', borderRadius: 99,
      background: map.bg, border: `1px solid ${map.bd}`, color: map.fg,
      fontFamily: 'Nunito', fontWeight: 800, fontSize: 12,
    }}>
      <span style={{ width: 8, height: 8, borderRadius: 99, background: map.dot }} />
      {map.label}
    </div>
  );
}

function CatExample({ kind, label, selected }) {
  const C = selected ? { bg: '#FBEEEA', bd: '#E8A598', fg: '#D88B7C' }
                     : { bg: '#fff',    bd: 'rgba(60,40,30,0.12)', fg: '#5C5347' };
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      padding: '12px 14px', borderRadius: 12,
      background: C.bg, border: `1.5px solid ${C.bd}`, color: C.fg,
      fontFamily: 'Quicksand', fontWeight: 700, fontSize: 12,
    }}>
      <CatIcon kind={kind} color={selected ? '#D88B7C' : '#7C7062'} />
      <span>{label}</span>
      {selected && (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{ marginLeft: 'auto' }}>
          <circle cx="12" cy="12" r="9" fill="#D88B7C"/>
          <path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
    </div>
  );
}

// CatIcon lives in submit-screen.jsx — re-export reference
const CatIcon = window.CatIcon;
// In case it wasn't exported, redefine a small fallback here:
if (typeof window.CatIcon === 'undefined') {
  window.CatIcon = ({ kind, color = '#7C7062' }) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke={color} strokeWidth="1.8"/>
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────
// Flow diagram
// ─────────────────────────────────────────────────────────────
function FlowCard() {
  const steps = [
    { n: '1', t: 'User mengisi form',    d: 'Isi nama, alamat, pin di peta, kategori, fasilitas, foto.' },
    { n: '2', t: 'Kirim untuk verifikasi', d: 'Submission masuk antrian admin · status pending.' },
    { n: '3', t: 'Admin meninjau',         d: 'Dinas memverifikasi lokasi dari dashboard pemerintah.' },
    { n: '4', t: 'Setujui / tolak',        d: 'Disetujui → tayang di peta · ditolak → user diberi tahu.' },
  ];
  return (
    <div style={{
      width: 940, padding: 32, background: '#FFFDFB',
      borderRadius: 24, border: '1px solid rgba(60,40,30,0.06)',
    }}>
      <div className="mono" style={{
        fontSize: 11, color: '#A89991', textTransform: 'uppercase',
        letterSpacing: 1.4, marginBottom: 6,
      }}>05 · FLOW</div>
      <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 18, fontFamily: 'Nunito' }}>
        Submission &amp; verification flow
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
        {steps.map((s, i) => (
          <div key={s.n} style={{ position: 'relative' }}>
            <div style={{
              padding: 16, borderRadius: 14, background: '#FBF4ED',
              border: '1px solid rgba(60,40,30,0.05)', height: '100%',
              boxSizing: 'border-box',
            }}>
              <div style={{
                width: 26, height: 26, borderRadius: 13,
                background: i >= 2 ? 'rgba(143,175,143,0.18)' : '#FBEEEA',
                color: i >= 2 ? '#6B8A6B' : '#D88B7C',
                fontFamily: 'Nunito', fontWeight: 900, fontSize: 12,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                marginBottom: 10,
              }}>{s.n}</div>
              <div style={{ fontFamily: 'Nunito', fontWeight: 800, fontSize: 14, color: '#333727' }}>
                {s.t}
              </div>
              <div style={{ fontSize: 12, color: '#5C5347', marginTop: 6, lineHeight: 1.45 }}>
                {s.d}
              </div>
            </div>
            {i < 3 && (
              <div style={{
                position: 'absolute', right: -10, top: '50%', transform: 'translateY(-50%)',
                color: '#D8B095', fontSize: 16, fontWeight: 900,
              }}>›</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// App
// ─────────────────────────────────────────────────────────────
function App() {
  const [t, setTweak] = useTweaks(DEFAULTS);
  return (
    <>
      <DesignCanvas background="#F6EFEA">
        <DCSection id="intro" title="" subtitle="">
          <DCArtboard id="brand" label="" width={760} height={170}
            style={{ background: 'transparent', boxShadow: 'none', border: 'none' }}>
            <BrandHeader />
          </DCArtboard>
        </DCSection>

        <DCSection id="screens" title="01 · Submission form"
          subtitle="Empty → filled → pending success. Each phone scrolls independently.">
          <DCArtboard id="empty"   label="A · Empty"   width={400} height={860}>
            <Phone variant="empty" />
          </DCArtboard>
          <DCArtboard id="filled"  label="B · Filled · ready to submit" width={400} height={860}>
            <Phone variant="filled" />
          </DCArtboard>
          <DCArtboard id="success" label="C · Pending verifikasi"       width={400} height={860}>
            <Phone variant="success" />
          </DCArtboard>
        </DCSection>

        <DCSection id="focus" title="02 · Focus view" subtitle="Switch state via the Tweaks panel.">
          <DCArtboard id="focus" label="Focus" width={460} height={900}>
            <Phone variant={t.focusVariant} />
          </DCArtboard>
        </DCSection>

        <DCSection id="components" title="03 · Components" subtitle="">
          <DCArtboard id="components" label="Building blocks" width={820} height={580}>
            <ComponentSheet />
          </DCArtboard>
        </DCSection>

        <DCSection id="admin" title="04 · Admin verification (gov dashboard)"
          subtitle="How Dinas Kesehatan sees and reviews pending submissions.">
          <DCArtboard id="admin-card" label="Detail card" width={500} height={420}>
            <AdminVerificationCard />
          </DCArtboard>
          <DCArtboard id="admin-queue" label="Antrian usulan · 4 rows" width={1000} height={560}>
            <AdminQueuePanel />
          </DCArtboard>
        </DCSection>

        <DCSection id="flow" title="05 · Flow" subtitle="">
          <DCArtboard id="flow" label="Submission flow" width={1000} height={300}>
            <FlowCard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Focus view">
          <TweakRadio label="Form state"
            value={t.focusVariant}
            onChange={(v) => setTweak('focusVariant', v)}
            options={[
              { value: 'empty',   label: 'Empty' },
              { value: 'filled',  label: 'Filled' },
              { value: 'success', label: 'Pending' },
            ]} />
        </TweakSection>
        <TweakSection label="Hint">
          <div style={{ fontSize: 12, color: '#8A7268', lineHeight: 1.5 }}>
            The pending screen uses an amber tint for a soft "waiting" status —
            distinct from the green success state used after a Laporan Kondisi.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
